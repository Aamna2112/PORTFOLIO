<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Performance Predictor</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 450px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
            color: #444;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #5568d8;
        }

        .result {
            margin-top: 25px;
            padding: 20px;
            background: #eef2ff;
            border-radius: 12px;
            text-align: center;
        }

        .result-title {
            color: #555;
            font-size: 15px;
        }

        .score {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
            margin-top: 8px;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            color: #999;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🎓 Student Performance Predictor</h1>

        <p class="subtitle">
            Predict a student's final exam score
        </p>

        <form method="POST">

            <label>Study Hours</label>
            <input
                type="number"
                name="study_hours"
                step="0.1"
                min="0"
                max="24"
                placeholder="Example: 6"
                required
            >

            <label>Attendance (%)</label>
            <input
                type="number"
                name="attendance"
                step="0.1"
                min="0"
                max="100"
                placeholder="Example: 80"
                required
            >

            <label>Previous Exam Score</label>
            <input
                type="number"
                name="previous_score"
                step="0.1"
                min="0"
                max="100"
                placeholder="Example: 70"
                required
            >

            <label>Assignment Score</label>
            <input
                type="number"
                name="assignment_score"
                step="0.1"
                min="0"
                max="100"
                placeholder="Example: 75"
                required
            >

            <label>Sleep Hours</label>
            <input
                type="number"
                name="sleep_hours"
                step="0.1"
                min="0"
                max="24"
                placeholder="Example: 8"
                required
            >

            <button type="submit">
                Predict Final Score
            </button>

        </form>

        {% if prediction is not none %}

        <div class="result">

            <div class="result-title">
                Predicted Final Score
            </div>

            <div class="score">
                {{ prediction }}
            </div>

        </div>

        {% endif %}

        <div class="footer">
            AI & Data Science Project
        </div>

    </div>

</body>

</html>
